<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unclench</title>
<meta name="description" content="Two minutes to put the day down: feet, jaw, shoulders, hands, three exhales, one thing you can see.">
<meta name="theme-color" content="#f4f1ea">
<style>
  :root {
    --bg: #f4f1ea;
    --fg: #1a1a1a;
    --accent: #d23b2a;
    --muted: #7a766e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141414; --fg: #f0ece4; --accent: #e4553f; --muted: #8c877d; }
  }
  :root { --h: 215; --light: hsl(var(--h) 60% 44%); --ink: hsl(var(--h) 70% 72%); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 400 18px/1.4 system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    display: grid;
    place-items: center;
    padding: 16px;
    -webkit-tap-highlight-color: transparent;
  }
  main { width: min(100%, 420px); display: grid; gap: 36px; justify-items: center; text-align: center; }
  h1 { font-size: 13px; font-weight: 500; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }

  .box { position: relative; width: min(72vw, 300px); aspect-ratio: 1; cursor: pointer; user-select: none; }
  .box svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .frame { fill: none; stroke: var(--fg); stroke-width: 2; }
  /* the room, seen through a window smaller than it is: black walls, hairline edges that leave through the sides of
     the frame, the red back wall coming closer. The walls take a little of its red only when it is near. */
  .box { --wall: #070707; --pale: #f0ece4; --red: hsl(4 100% 54%); }   /* the wall's own red; it breathes a little while running (glow()) */
  .room { fill: var(--wall); }
  .inner { fill: var(--red); }
  .edge { stroke: var(--pale); stroke-opacity: .05; stroke-width: .5; }   /* room() raises this as the wall nears */
  .label { color: var(--pale); }

  .label { position: absolute; inset: 0; display: grid; place-content: center; gap: 10px; padding: 18px; pointer-events: none; }
  .part { font-size: 14px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; }
  .ask { font-size: 22px; font-weight: 300; line-height: 1.25; }

  .meta { display: flex; gap: 32px; color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; }

  button {
    font: inherit; font-size: 14px; border-radius: 0; color: var(--fg); background: none;
    font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
    border: 2px solid var(--fg); padding: 10px 30px; cursor: pointer;
  }
  button:hover, button:focus-visible { background: var(--fg); color: var(--bg); outline: none; }

  .row { display: flex; gap: 20px; align-items: center; justify-content: center; flex-wrap: wrap; }
  /* sound switch: a small square of light, the word lit by it */
  .snd { display: inline-flex; align-items: center; gap: 12px; padding: 8px 4px; min-height: 44px; background: none; border: 0; color: var(--muted); letter-spacing: .1em; }
  .snd:hover, .snd:focus-visible { opacity: 1; outline: none; }
  .snd:focus-visible .sq { outline: 2px solid var(--fg); outline-offset: 3px; }
  .snd .sq { display: block; width: 18px; height: 18px; border: 2px solid var(--fg); box-sizing: border-box; transition: background .4s, border-color .4s, box-shadow .4s, transform .15s; }
  .snd:active .sq { transform: scale(.85); }
  .snd[aria-pressed="true"] .sq { background: var(--light); border-color: var(--light); box-shadow: 0 0 16px var(--light); }
  .snd .word { display: inline-grid; grid-auto-flow: column; align-items: baseline; transition: color .5s, text-shadow .5s; }
  .snd .word > :first-child { grid-area: 1 / 1; white-space: pre; }
  .snd .on, .snd .off { grid-area: 1 / 2; visibility: hidden; }
  .snd[aria-pressed="true"] .on { visibility: visible; }
  .snd[aria-pressed="false"] .off { visibility: visible; }
  .snd[aria-pressed="true"] .word { color: var(--ink); text-shadow: 0 0 12px hsl(var(--h) 80% 60% / .7); }


  #btn { min-width: 140px; } #snd { min-width: 128px; }                      /* same on every page: the label changes, the button and the switch do not move */
  .hint { color: var(--muted); font-size: 14px; min-height: 4.2em; }   /* room for three lines on every page, so the carousel sits at one height */
  /* the way to the other instrument: one grey word, last on the page */
  .x { display: inline-flex; align-items: center; min-height: 44px; padding: 10px 8px; color: var(--muted); font-size: 12px; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; text-decoration: none; }
  .x:hover, .x:focus-visible, .x[aria-current] { color: var(--fg); outline: none; }
  /* the switch: neighbour's shape and name, arrow, this page's shape and name, arrow, neighbour's name and shape.
     The middle is 116 px on every page and the sides share the rest, so the arrows never move. */
  .nav { display: grid; grid-template-columns: minmax(0, 1fr) 116px minmax(0, 1fr); align-items: center; width: 100%; }
  .nav .x { gap: 6px; padding-left: 0; padding-right: 0; }
  .nav span.x { justify-content: center; }
  .nav a.x { min-width: 0; font-size: 9.5px; letter-spacing: .04em; }
  .nav a.x:first-child { justify-content: flex-end; }
  .nav a.x:last-child { justify-content: flex-start; }
  /* one line through the middle: each word's box is cut to its capitals, so its centre is the ink's centre in any font */
  .nav .n { min-width: 0; overflow-x: clip; overflow-y: visible; white-space: nowrap; line-height: 1; text-box: trim-both cap alphabetic; }
  .nav svg.ar { margin: 0 1px; }                                       /* the arrow is drawn, not typed: its shaft is the centre line */
  .nav svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 9; flex: none; overflow: visible; }   /* each exercise's own shape, as a contour */

  @media (prefers-reduced-motion: reduce) { .inner { transition: none; } }
  /* lang:start (written by sounds/recipe/lang.py) */
  /* the language switch: one small word in the corner, the language it would change to */
  #lang { position: fixed; top: 0; right: 0; min-width: 48px; min-height: 44px; padding: 7px 12px 0 0; display: grid; place-content: start end;
          background: none; border: 0; color: var(--muted); font-size: 10.5px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; opacity: 1; }
  #lang:hover, #lang:focus-visible { color: var(--fg); opacity: 1; outline: none; }
  #lang:focus-visible { text-decoration: underline; text-underline-offset: 4px; }
  /* lang:end */
</style>
</head>
<body>
<main>
  <h1>Unclench · 2 minutes</h1>

  <div class="box" id="box" title="Tap to begin or pause">
    <svg viewBox="0 0 100 100" role="img" aria-label="A room seen from its doorway; the red back wall comes closer with each step until it fills the frame">
      <defs>
        <clipPath id="win"><rect x="0" y="0" width="100" height="100"/></clipPath>
        <linearGradient id="g0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="var(--red)"/><stop offset="1" stop-color="var(--red)" stop-opacity="0"/></linearGradient>
        <linearGradient id="g1" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="var(--red)"/><stop offset="1" stop-color="var(--red)" stop-opacity="0"/></linearGradient>
        <linearGradient id="g2" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="var(--red)"/><stop offset="1" stop-color="var(--red)" stop-opacity="0"/></linearGradient>
        <linearGradient id="g3" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="var(--red)"/><stop offset="1" stop-color="var(--red)" stop-opacity="0"/></linearGradient>
      </defs>
      <g clip-path="url(#win)">
        <rect class="room" x="0" y="0" width="100" height="100"/>
        <polygon id="w0" fill="url(#g0)"/><polygon id="w1" fill="url(#g1)"/><polygon id="w2" fill="url(#g2)"/><polygon id="w3" fill="url(#g3)"/>
        <line class="edge" id="e0"/><line class="edge" id="e1"/><line class="edge" id="e2"/><line class="edge" id="e3"/>
        <rect class="inner" id="inner"/>
      </g>
      <rect class="frame" x="0" y="0" width="100" height="100"/>
    </svg>
    <div class="label" aria-live="polite">
      <div class="part" id="part">Ready</div>
      <div class="ask" id="ask">Put the day down for two minutes.</div>
    </div>
  </div>

  <div class="meta">
    <span id="where">Step 0 / 6</span>
    <span id="left">2:00</span>
  </div>

  <div class="row">
    <button id="btn" type="button">Begin</button>
    <button id="snd" type="button" class="snd" aria-pressed="true"><span class="sq"></span><span class="word"><span>Sound </span><span class="on">on</span><span class="off">off</span></span></button>
  </div>
  <p class="hint">A ping marks each step; it moves on by itself. Tap to pause. Space works too.</p>
  <nav class="nav" aria-label="Instruments"><a class="x" href="index.html" aria-label="Previous: Box"><svg viewBox="0 0 100 100" aria-hidden="true"><rect x="8" y="8" width="84" height="84"/></svg><span class="n">Box</span><svg class="ar" viewBox="0 0 100 100" aria-hidden="true"><path d="M94 50H10M40 20L10 50l30 30"/></svg></a><span class="x" aria-current="page"><svg viewBox="0 0 100 100" aria-hidden="true"><rect x="8" y="8" width="84" height="84"/><rect x="38" y="38" width="24" height="24"/></svg><span class="n">Unclench</span></span><a class="x" href="hexagon.html" aria-label="Next: Hex"><svg class="ar" viewBox="0 0 100 100" aria-hidden="true"><path d="M6 50h84M60 20l30 30-30 30"/></svg><span class="n">Hex</span><svg viewBox="0 0 100 100" aria-hidden="true"><polygon points="50,5 89,27.5 89,72.5 50,95 11,72.5 11,27.5"/></svg></a></nav>
</main>

<script>
(() => {
  // Each step: a body part, one small request, a suggested time in seconds.
  // The square grows during that time; when it is up, a ping, and the next step. A tap moves on early.
  const STEPS = [
    { part: 'Feet',      ask: 'Feel the floor under them.',           secs: 20 },
    { part: 'Jaw',       ask: 'Let it drop a little.',                 secs: 15 },
    { part: 'Shoulders', ask: 'Let them fall away from your ears.',    secs: 20 },
    { part: 'Hands',     ask: 'Open them. Palms up.',                  secs: 15 },
    { part: 'Breath',    ask: 'Three long exhales.', secs: 30, breath: { inSecs: 4, outSecs: 6, n: 3 } },
    { part: 'Eyes',      ask: 'One thing you can see. Just look.',     secs: 20 },
  ];
  const N = STEPS.length;
  const TOTAL = STEPS.reduce((a, s) => a + s.secs, 0);   // 120 s
  const SIZE0 = 0.12;                                     // the clenched square
  // A real wall in a real room: it starts at rest, gathers speed over RAMP of the time, travels steadily, and slows to a
  // full stop at the window. What the eye gets is 1 / distance, so it creeps for a long while and looms at the end.
  const RAMP = 0.2;
  function nearAt(t) {                                      // t seconds into the exercise -> k for room()
    const x = Math.max(0, Math.min(1, t / TOTAL)), v = 1 / (1 - RAMP);          // v: the steady speed
    const gone = x < RAMP ? v * x * x / (2 * RAMP) : x > 1 - RAMP ? 1 - v * (1 - x) * (1 - x) / (2 * RAMP) : v * (x - RAMP / 2);
    const far = 1 / SIZE0;                                // the wall starts this many times farther off than it ends
    return 1 / (far + (1 - far) * gone);
  }

  const $ = id => document.getElementById(id);
  const inner = $('inner'), partEl = $('part'), askEl = $('ask');
  // the room is wider than the window (MX, MY per side, in frame units), so its edges miss the frame's corners
  const MX = 12, MY = 3, GLOW = 0.10, REACH = 0.22;
  const walls = [0, 1, 2, 3].map(i => $('w' + i)), edges = [0, 1, 2, 3].map(i => $('e' + i)), grads = [0, 1, 2, 3].map(i => $('g' + i));
  function room(k) {                                      // k: how near the back wall is, SIZE0 far .. 1 here (it fills the window)
    const sc = 50 / (50 + Math.min(MX, MY)), hx = k * (50 + MX) * sc, hy = k * (50 + MY) * sc;
    const x0 = 50 - hx, x1 = 50 + hx, y0 = 50 - hy, y1 = 50 + hy, ox = -MX, Ox = 100 + MX, oy = -MY, Oy = 100 + MY;
    const C = [[x0, y0], [x1, y0], [x1, y1], [x0, y1]], R = [[ox, oy], [Ox, oy], [Ox, Oy], [ox, Oy]];   // back wall corners, room corners
    const far = [[50, y0], [x1, 50], [50, y1], [x0, 50]], near = [[50, oy], [Ox, 50], [50, Oy], [ox, 50]];
    const t = Math.max(0, Math.min(1, (k - 0.6) / 0.3)), red = GLOW * t * t * (3 - 2 * t);               // red only on the last stretch
    const seen = (0.05 + 0.27 * Math.sqrt(Math.max(0, (k - SIZE0) / (1 - SIZE0)))).toFixed(3);          // the room's edges come out of the dark as the wall nears
    for (let i = 0; i < 4; i++) {
      const j = (i + 1) % 4, f = far[i], n = near[i], g = grads[i], e = edges[i];
      e.setAttribute('stroke-opacity', seen);
      walls[i].setAttribute('points', [R[i], R[j], C[j], C[i]].map(p => p.map(v => v.toFixed(2)).join(',')).join(' '));
      g.setAttribute('x1', f[0]); g.setAttribute('y1', f[1]);
      g.setAttribute('x2', f[0] + (n[0] - f[0]) * REACH); g.setAttribute('y2', f[1] + (n[1] - f[1]) * REACH);
      g.firstElementChild.setAttribute('stop-opacity', red.toFixed(3));
      e.setAttribute('x1', C[i][0]); e.setAttribute('y1', C[i][1]); e.setAttribute('x2', R[i][0]); e.setAttribute('y2', R[i][1]);
    }
    inner.setAttribute('x', x0); inner.setAttribute('y', y0); inner.setAttribute('width', x1 - x0); inner.setAttribute('height', y1 - y0);
    inner.setAttribute('fill-opacity', (0.86 + 0.14 * k).toFixed(3));
  }
  // the red is light, not paint: it swells and settles once every PULSE seconds, by an amount close to the edge of noticing
  const PULSE = 7, still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const DRIFT = 48;                                       // seconds for the red to go through cherry to purple and back
  function glow(t) {
    const p = still ? 0 : Math.sin(2 * Math.PI * t / PULSE), c = 0.5 - 0.5 * Math.cos(2 * Math.PI * t / DRIFT);   // c: 0 red .. 1 purple
    $('box').style.setProperty('--red', `hsl(${(4 - 42 * c + 2 * p).toFixed(2)} 100% ${(54 - 5 * c + 3 * p).toFixed(2)}%)`);
  }
  room(SIZE0);
  const whereEl = $('where'), leftEl = $('left'), btn = $('btn'), box = $('box');
  const root = document.documentElement;

  let step = -1;          // -1 ready, 0..N-1 in a step, N done
  let inStep = 0;         // seconds in the current step
  let spent = 0;          // suggested seconds of finished steps
  let actual = 0;         // real seconds since Begin
  let rang = false;       // the step's "time is up" tone has played
  let exhale = -1;        // which exhale tone is sounding
  let running = false, last = 0, raf = 0;
  let held = false;       // paused by the person (not by a hidden tab)
  let sl = null;          // the exhale tone now sounding

  // Keep the phone's screen on while the timer runs (Android Chrome/Firefox, HTTPS).
  // Released on pause, finish, or when the tab is hidden. Nothing happens if unsupported.
  let lock = null;
  async function keepAwake() {
    try { if (!lock && navigator.wakeLock) { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => { lock = null; }); } } catch (e) {}
  }
  function letSleep() { if (lock) { lock.release().catch(() => {}); lock = null; } }

  const fmt = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };


  // ---- sound: made here, no files. Nothing plays before a tap. One setting for all instruments. ----
  let ctx = null, sound = true;
  try { sound = localStorage.getItem('instruments.sound') !== 'off'; } catch (e) {}
  const sndBtn = $('snd');
  const showSound = () => sndBtn.setAttribute('aria-pressed', String(sound));
  showSound();
  const mkCtx = () => {                         // one context; on iPhone the 'playback' session keeps the ring switch from muting it
    const c = new (window.AudioContext || window.webkitAudioContext)();
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
    return c;
  };
  const audio = () => {
    if (!sound) return null;
    try {
      if (!ctx) ctx = mkCtx();
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    } catch (e) { return null; }
  };

  const RULES = [["^Round ", "Круг "], ["^Lap ", "Круг "], ["^Step ", "Шаг "], ["^Part ", "Часть "], ["^Side ", "Сторона "], ["^You took ", "Заняло "], ["^In · ", "Вдох · "], ["^Out, long · ", "Долгий выдох · "], [" of ", " из "], ["^Previous: ", "Назад: "], ["^Next: ", "Дальше: "]].map(([a, b]) => [new RegExp(a), b]);
  const HERE = {};                               // this page's phase word only, where it differs from the shared one
  const ru = (s, n) => n && n.parentNode.id === 'phase' && HERE[s] !== undefined ? HERE[s] : RU[s] !== undefined ? RU[s] : RULES.reduce((x, [a, b]) => x.replace(a, b), s);
  const btn = document.getElementById('lang'), root = document.documentElement;
  let lang = 'en';
  try { lang = localStorage.getItem('instruments.lang') || ((navigator.language || '').slice(0, 2) === 'ru' ? 'ru' : 'en'); } catch (e) {}
  const TITLE = document.title, ATTRS = [];
  for (const el of document.querySelectorAll('[title], [aria-label]')) for (const a of ['title', 'aria-label']) if (el.hasAttribute(a)) ATTRS.push([el, a, el.getAttribute(a)]);
  const show = n => {                                  // one text node
    if (n._en === undefined) n._en = n.data;
    if (!n._en.trim() || btn.contains(n)) return;
    const s = lang === 'ru' ? ru(n._en, n) : n._en;
    if (n.data !== s) n.data = s;
  };
  const walk = el => { const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT); for (let n; (n = w.nextNode());) if (!n.parentNode.closest('script, style')) show(n); };
  const apply = () => {
    root.lang = lang;
    document.title = lang === 'ru' ? ru(TITLE) : TITLE;
    for (const [el, a, s] of ATTRS) el.setAttribute(a, lang === 'ru' ? ru(s) : s);
    btn.textContent = lang === 'ru' ? 'Eng' : 'Рус';
    btn.setAttribute('aria-label', lang === 'ru' ? 'English' : 'Русский язык');
    btn.lang = lang === 'ru' ? 'en' : 'ru';
    walk(document.body);
  };
  // whatever the page writes later: textContent makes a new text node, which arrives here before it is painted
  new MutationObserver(recs => { for (const r of recs) for (const n of r.addedNodes) { if (n.nodeType === 3) show(n); else if (n.nodeType === 1) walk(n); } })
    .observe(document.body, { childList: true, subtree: true });
  btn.addEventListener('click', e => {
    e.stopPropagation();
    lang = lang === 'ru' ? 'en' : 'ru';
    try { localStorage.setItem('instruments.lang', lang); } catch (e) {}
    apply();
  });
  apply();
})();
