<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unclench</title>
<meta name="description" content="Two minutes to put the day down: feet, jaw, shoulders, hands, three exhales, one thing you can see.">
<meta name="theme-color" content="#f4f1ea">
<style>
  :root {
    --bg: #f4f1ea;
    --fg: #1a1a1a;
    --accent: #d23b2a;
    --muted: #7a766e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141414; --fg: #f0ece4; --accent: #e4553f; --muted: #8c877d; }
  }
  :root { --h: 215; --light: hsl(var(--h) 60% 44%); --ink: hsl(var(--h) 70% 72%); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 400 18px/1.4 system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    display: grid;
    place-items: center;
    padding: 16px;
    -webkit-tap-highlight-color: transparent;
  }
  main { width: min(100%, 420px); display: grid; gap: 24px; justify-items: center; text-align: center; }
  h1 { font-size: 14px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }

  .box { position: relative; width: min(72vw, 300px); aspect-ratio: 1; cursor: pointer; user-select: none; }
  .box svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .frame { fill: none; stroke: var(--fg); stroke-width: 2; }
  .inner { fill: var(--accent); transform-origin: 50% 50%; transform: scale(var(--s, .12)); }

  .label { position: absolute; inset: 0; display: grid; place-content: center; gap: 10px; padding: 18px; pointer-events: none; }
  .part { font-size: 14px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; }
  .ask { font-size: 22px; font-weight: 300; line-height: 1.25; }

  .meta { display: flex; gap: 32px; color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; }

  button {
    font: inherit; font-size: 14px; border-radius: 0; color: var(--fg); background: none;
    font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
    border: 2px solid var(--fg); padding: 10px 28px; cursor: pointer;
  }
  button:hover, button:focus-visible { background: var(--fg); color: var(--bg); outline: none; }

  .row { display: flex; gap: 20px; align-items: center; justify-content: center; flex-wrap: wrap; }
  /* sound switch: a small square of light, the word lit by it */
  .snd { display: inline-flex; align-items: center; gap: 12px; padding: 8px 4px; min-height: 44px; background: none; border: 0; color: var(--muted); letter-spacing: .1em; }
  .snd:hover, .snd:focus-visible { opacity: 1; outline: none; }
  .snd:focus-visible .sq { outline: 2px solid var(--fg); outline-offset: 3px; }
  .snd .sq { display: block; width: 18px; height: 18px; border: 2px solid var(--fg); box-sizing: border-box; transition: background .4s, border-color .4s, box-shadow .4s, transform .15s; }
  .snd:active .sq { transform: scale(.85); }
  .snd[aria-pressed="true"] .sq { background: var(--light); border-color: var(--light); box-shadow: 0 0 16px var(--light); }
  .snd .word { display: inline-grid; grid-auto-flow: column; align-items: baseline; transition: color .5s, text-shadow .5s; }
  .snd .word > :first-child { grid-area: 1 / 1; white-space: pre; }
  .snd .on, .snd .off { grid-area: 1 / 2; visibility: hidden; }
  .snd[aria-pressed="true"] .on { visibility: visible; }
  .snd[aria-pressed="false"] .off { visibility: visible; }
  .snd[aria-pressed="true"] .word { color: var(--ink); text-shadow: 0 0 12px hsl(var(--h) 80% 60% / .7); }


  .hint { color: var(--muted); font-size: 14px; }
  /* the way to the other instrument: one grey word, last on the page */
  .x { display: inline-flex; align-items: center; min-height: 44px; padding: 10px 8px; color: var(--muted); font-size: 12px; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; text-decoration: none; }
  .x:hover, .x:focus-visible { color: var(--fg); outline: none; }

  @media (prefers-reduced-motion: reduce) { .inner { transition: none; } }
</style>
</head>
<body>
<main>
  <h1>Unclench · 2 minutes</h1>

  <div class="box" id="box" title="Tap to begin or move on">
    <svg viewBox="0 0 100 100" role="img" aria-label="A small red square inside a frame; it grows one size per step until it fills the frame">
      <rect class="frame" x="0" y="0" width="100" height="100"/>
      <rect class="inner" id="inner" x="0" y="0" width="100" height="100"/>
    </svg>
    <div class="label" aria-live="polite">
      <div class="part" id="part">Ready</div>
      <div class="ask" id="ask">Put the day down for two minutes.</div>
    </div>
  </div>

  <div class="meta">
    <span id="where">Step 0 / 6</span>
    <span id="left">2:00</span>
  </div>

  <div class="row">
    <button id="btn" type="button">Begin</button>
    <button id="snd" type="button" class="snd" aria-pressed="true"><span class="sq"></span><span class="word"><span>Sound </span><span class="on">on</span><span class="off">off</span></span></button>
  </div>
  <p class="hint">A click marks each step. Tap to move on early. Space works too.</p>
  <a class="x" href="index.html">← Box breathing</a>
</main>

<script>
(() => {
  // Each step: a body part, one small request, a suggested time in seconds.
  // The square grows during that time; when it is up, a ping, and the next step. A tap moves on early.
  const STEPS = [
    { part: 'Feet',      ask: 'Feel the floor under them.',           secs: 20 },
    { part: 'Jaw',       ask: 'Let it drop a little.',                 secs: 15 },
    { part: 'Shoulders', ask: 'Let them fall away from your ears.',    secs: 20 },
    { part: 'Hands',     ask: 'Open them. Palms up.',                  secs: 15 },
    { part: 'Breath',    ask: 'Three long exhales.', secs: 30, breath: { inSecs: 4, outSecs: 6, n: 3 } },
    { part: 'Eyes',      ask: 'One thing you can see. Just look.',     secs: 20 },
  ];
  const N = STEPS.length;
  const TOTAL = STEPS.reduce((a, s) => a + s.secs, 0);   // 120 s
  const SIZE0 = 0.12;                                     // the clenched square
  const sizeAt = i => SIZE0 + (1 - SIZE0) * i / N;        // after i steps

  const $ = id => document.getElementById(id);
  const inner = $('inner'), partEl = $('part'), askEl = $('ask');
  const whereEl = $('where'), leftEl = $('left'), btn = $('btn'), box = $('box');
  const root = document.documentElement;

  let step = -1;          // -1 ready, 0..N-1 in a step, N done
  let inStep = 0;         // seconds in the current step
  let spent = 0;          // suggested seconds of finished steps
  let actual = 0;         // real seconds since Begin
  let rang = false;       // the step's "time is up" tone has played
  let exhale = -1;        // which exhale tone is sounding
  let running = false, last = 0, raf = 0;

  // Keep the phone's screen on while the timer runs (Android Chrome/Firefox, HTTPS).
  // Released on pause, finish, or when the tab is hidden. Nothing happens if unsupported.
  let lock = null;
  async function keepAwake() {
    try { if (!lock && navigator.wakeLock) { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => { lock = null; }); } } catch (e) {}
  }
  function letSleep() { if (lock) { lock.release().catch(() => {}); lock = null; } }

  const fmt = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };


  // ---- sound: made here, no files. Nothing plays before a tap. One setting for all instruments. ----
  let ctx = null, sound = true;
  try { sound = localStorage.getItem('instruments.sound') !== 'off'; } catch (e) {}
  const sndBtn = $('snd');
  const showSound = () => sndBtn.setAttribute('aria-pressed', String(sound));
  showSound();
  const audio = () => {
    if (!sound) return null;
    try {
      if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    } catch (e) { return null; }
  };

    if (bufs[key]) return go(bufs[key]);
    const bin = atob(b64), arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    c.decodeAudioData(arr.buffer, buf => { bufs[key] = buf; go(buf); }, () => {});
  }
  // decode both at load, off the main context (no tap needed), so the first play is on time
  try {
    const off = new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(1, 8, 8000);
    for (const [key, b64] of Object.entries({ switch: SWITCH_WAV, step: STEP_WAV })) {
      const bin = atob(b64), arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      off.decodeAudioData(arr.buffer, buf => { bufs[key] = buf; }, () => {});
    }
  } catch (e) {}
  const switchClick = () => play('switch', SWITCH_WAV, 0.9, true);
  sndBtn.addEventListener('click', e => {
    e.stopPropagation();
    sound = !sound; showSound();
    try { localStorage.setItem('instruments.sound', sound ? 'on' : 'off'); } catch (e) {}
    switchClick(); if (!sound) humOff(); else if (running) humOn();
  });
  // ---- the hum (gallery U4): C4 and the C two octaves up, a third of a hertz off so they beat slowly, with a band of
  // air (300-700 Hz), in a 2 s dark room. It breathes: up 40 cents over 4 s, down over 6 s, the whole way through.
  // Level 0.22; ducks under the clicks. Nothing under 180 Hz.
  let hum = null;
  function humOn() {
    const c = audio(); if (!c || hum) return;
    const t = c.currentTime, out = c.createGain(), level = 0.22;
    out.gain.setValueAtTime(0, t); out.gain.linearRampToValueAtTime(level, t + 2.5);
    const base = [262, 1048.3], mix = [0.7, 0.18];
    const dry = c.createGain(); dry.gain.value = 0.6;
    const voices = base.map((f, i) => { const o = c.createOscillator(), v = c.createGain(); o.type = 'sine'; o.frequency.value = f; v.gain.value = mix[i]; o.connect(v).connect(dry); o.start(); return o; });
    const n = c.createBufferSource(), buf = c.createBuffer(1, c.sampleRate * 2, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    n.buffer = buf; n.loop = true;
    const bpf = c.createBiquadFilter(); bpf.type = 'bandpass'; bpf.frequency.value = 460; bpf.Q.value = 1.1;
    const air = c.createGain(); air.gain.value = 0.35;
    n.connect(bpf).connect(air).connect(dry); n.start();
    const ir = c.createBuffer(1, c.sampleRate * 2, c.sampleRate), e = ir.getChannelData(0);   // the room: 2 s of dying noise
    for (let i = 0; i < e.length; i++) e[i] = (Math.random() * 2 - 1) * Math.exp(-6.9 * i / e.length);
    const room = c.createConvolver(); room.buffer = ir; room.normalize = true;
    const dark = c.createBiquadFilter(); dark.type = 'lowpass'; dark.frequency.value = 1500;
    const wet = c.createGain(); wet.gain.value = 0.4;
    dry.connect(out); dry.connect(room).connect(dark).connect(wet).connect(out);
    out.connect(c.destination);
    hum = { out, level, base, voices, stop: () => { voices.forEach(o => o.stop()); n.stop(); } };
  }
  function humBreathe(sec) {                    // a 10 s breath: in over 4, out over 6, up to 40 cents
    if (!hum) return;
    const u = (sec % 10) / 10, b = u < 0.4 ? u / 0.4 : 1 - (u - 0.4) / 0.6, e = b * b * (3 - 2 * b);
    const t = ctx.currentTime, k = Math.pow(2, 40 * e / 1200);
    hum.voices.forEach((o, i) => o.frequency.setTargetAtTime(hum.base[i] * k, t, 0.3));
  }
  function humDuck(sec) {                       // the hum steps aside under a click, so the two never add past 1 (rule 12)
    if (!hum) return;
    const t = ctx.currentTime, g = hum.out.gain;
    g.cancelScheduledValues(t); g.setTargetAtTime(hum.level * 0.3, t, 0.01); g.setTargetAtTime(hum.level, t + sec, 0.12);
  }
  function humOff() {
    if (!hum) return;
    const h = hum, t = ctx.currentTime; hum = null;
    h.out.gain.cancelScheduledValues(t); h.out.gain.setValueAtTime(h.out.gain.value, t); h.out.gain.linearRampToValueAtTime(0, t + 1.5);
    setTimeout(() => { try { h.stop(); h.out.disconnect(); } catch (e) {} }, 1700);
  }
  // One soft low tone: "the time has passed, if you want".
  const ping = () => play('step', STEP_WAV, 0.8, false);   // a step is over: the click
  // A tone that slides down over the exhale: something to ride the breath on.
  function slide(secs) {
    const c = audio(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain(), t = c.currentTime;
    o.type = 'sine';
    o.frequency.setValueAtTime(330, t);
    o.frequency.exponentialRampToValueAtTime(165, t + secs);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.45, t + 0.3);
    g.gain.setValueAtTime(0.45, t + secs - 0.5);
    g.gain.linearRampToValueAtTime(0, t + secs);
    o.connect(g).connect(c.destination);
    o.start(t); o.stop(t + secs);
  }

  // ---- the instrument ----
  function show() {
    const s = STEPS[step];
    partEl.textContent = s.part;
    askEl.textContent = s.ask;
    whereEl.textContent = `Step ${step + 1} / ${N}`;
    btn.textContent = step === N - 1 ? 'Finish' : 'Next';
  }

  function breathText(s) {
    const b = s.breath, cycle = b.inSecs + b.outSecs;
    const k = Math.min(b.n - 1, Math.floor(inStep / cycle));
    const t = inStep - k * cycle;
    if (inStep >= b.n * cycle) { askEl.textContent = s.ask; return; }
    if (t < b.inSecs) { askEl.textContent = `In · ${k + 1} of ${b.n}`; }
    else {
      askEl.textContent = `Out, long · ${k + 1} of ${b.n}`;
      if (exhale !== k) { exhale = k; slide(b.outSecs); }
    }
  }

  function tick(now) {
    if (!running) return;
    const dt = (now - last) / 1000;
    last = now;
    inStep += dt; actual += dt;
    humBreathe(actual);
    const s = STEPS[step];
    const f = Math.min(1, inStep / s.secs);
    inner.style.setProperty('--s', sizeAt(step) + (sizeAt(step + 1) - sizeAt(step)) * f);
    leftEl.textContent = fmt(TOTAL - spent - Math.min(inStep, s.secs));
    root.style.setProperty('--h', 215 + 110 * (0.5 - 0.5 * Math.cos(2 * Math.PI * (spent + Math.min(inStep, s.secs)) / TOTAL)));
    if (s.breath) breathText(s);
    if (f >= 1 && !rang) { rang = true; ping(); next(); if (!running) return; }   // time is up: the cue, then on
    raf = requestAnimationFrame(tick);
  }

  function begin() {
    step = 0; inStep = 0; spent = 0; actual = 0; rang = false; exhale = -1;
    audio();                                    // unlock audio on the user's tap
    show();
    resume();
  }

  function next() {
    spent += STEPS[step].secs;
    step += 1; inStep = 0; rang = false; exhale = -1;
    if (step >= N) { finish(); return; }
    inner.style.setProperty('--s', sizeAt(step));
    show();
  }

  function resume() { running = true; last = performance.now(); keepAwake(); humOn(); raf = requestAnimationFrame(tick); }
  function pause()  { running = false; cancelAnimationFrame(raf); letSleep(); humOff(); }

  function finish() {
    pause();
    step = N;
    inner.style.setProperty('--s', 1);
    partEl.textContent = 'Done';
    askEl.textContent = 'The next thing is yours to choose.';
    whereEl.textContent = `You took ${fmt(actual)}`;
    leftEl.textContent = '';
    btn.textContent = 'Again';
  }

  function reset() {
    inner.style.setProperty('--s', SIZE0);
    root.style.setProperty('--h', 215);
    partEl.textContent = 'Ready';
    askEl.textContent = 'Put the day down for two minutes.';
    whereEl.textContent = `Step 0 / ${N}`;
    leftEl.textContent = fmt(TOTAL);
    btn.textContent = 'Begin';
    step = -1;
  }

  function act() {
    if (step < 0) begin();
    else if (step >= N) reset();
    else next();
  }

  btn.addEventListener('click', act);
  box.addEventListener('click', act);
  document.addEventListener('keydown', e => {
    if (e.code === 'Space' && !e.repeat) { e.preventDefault(); act(); }
  });
  document.addEventListener('visibilitychange', () => {
    if (step < 0 || step >= N) return;
    if (document.hidden) pause(); else if (!running) resume();
  });
})();
</script>
</body>
</html>
