<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Box Breathing</title>
<meta name="description" content="Three minutes of box breathing: inhale 4, hold 4, exhale 4, hold 4.">
<meta name="theme-color" content="#f4f1ea">
<style>
  :root {
    --bg: #f4f1ea;
    --fg: #1a1a1a;
    --accent: #d23b2a;
    --muted: #7a766e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141414; --fg: #f0ece4; --accent: #e4553f; --muted: #8c877d; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 400 18px/1.4 system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    display: grid;
    place-items: center;
    padding: 16px;
    -webkit-tap-highlight-color: transparent;
  }
  main { width: min(100%, 420px); display: grid; gap: 28px; justify-items: center; text-align: center; }
  h1 { font-size: 14px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }

  .box { position: relative; width: min(72vw, 300px); aspect-ratio: 1; cursor: pointer; user-select: none; }
  .box svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .fill { fill: var(--fg); opacity: .08; transform-origin: 50% 50%; transform: scale(var(--s, 0)); }
  .frame { fill: none; stroke: var(--fg); stroke-width: 2; }
  .dot { fill: var(--accent); }

  .label { position: absolute; inset: 0; display: grid; place-content: center; gap: 6px; pointer-events: none; }
  .phase { font-size: 22px; font-weight: 600; letter-spacing: .04em; }
  .count { font-size: 56px; font-weight: 300; line-height: 1; font-variant-numeric: tabular-nums; }

  .meta { display: flex; gap: 32px; color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; }

  button {
    font: inherit; font-size: 14px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
    border: 2px solid var(--fg); background: none; color: var(--fg);
    padding: 10px 28px; cursor: pointer; border-radius: 0;
  }
  button:hover, button:focus-visible { background: var(--fg); color: var(--bg); outline: none; }

  .hint { color: var(--muted); font-size: 14px; }

  @media (prefers-reduced-motion: reduce) { .fill { display: none; } }
</style>
</head>
<body>
<main>
  <h1>Box breathing · 3 minutes</h1>

  <div class="box" id="box" title="Click to start or pause">
    <svg viewBox="0 0 100 100" role="img" aria-label="A square; a dot travels one edge per breath phase">
      <rect class="fill" x="0" y="0" width="100" height="100"/>
      <rect class="frame" x="0" y="0" width="100" height="100"/>
      <circle class="dot" id="dot" cx="0" cy="0" r="4"/>
    </svg>
    <div class="label" aria-live="polite">
      <div class="phase" id="phase">Ready</div>
      <div class="count" id="count">4 · 4 · 4 · 4</div>
    </div>
  </div>

  <div class="meta">
    <span id="round">Round 0 / 11</span>
    <span id="left">2:56</span>
  </div>

  <button id="btn" type="button">Start</button>
  <p class="hint">Inhale 4 · Hold 4 · Exhale 4 · Hold 4. Space starts or pauses.</p>
</main>

<script>
(() => {
  const PHASE = 4;                                  // seconds per side
  const PHASES = ['Inhale', 'Hold', 'Exhale', 'Hold'];
  const ROUNDS = 11;                                // 11 × 16 s = 2:56 ≈ 3 min
  const CYCLE = PHASE * 4;
  const TOTAL = CYCLE * ROUNDS;

  const $ = id => document.getElementById(id);
  const dot = $('dot'), fill = document.querySelector('.fill');
  const phaseEl = $('phase'), countEl = $('count'), roundEl = $('round'), leftEl = $('left');
  const btn = $('btn'), box = $('box');

  let running = false, elapsed = 0, last = 0, raf = 0;

  const fmt = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

  function render(t) {
    const inCycle = t % CYCLE;
    const p = Math.floor(inCycle / PHASE);          // 0..3: which side
    const f = (inCycle - p * PHASE) / PHASE;        // 0..1 along that side
    let cx, cy;
    if (p === 0)      { cx = f * 100;       cy = 0; }          // top, left → right
    else if (p === 1) { cx = 100;           cy = f * 100; }    // right, down
    else if (p === 2) { cx = 100 - f * 100; cy = 100; }        // bottom, right → left
    else              { cx = 0;             cy = 100 - f * 100; } // left, up
    dot.setAttribute('cx', cx);
    dot.setAttribute('cy', cy);
    fill.style.setProperty('--s', p === 0 ? f : p === 1 ? 1 : p === 2 ? 1 - f : 0);
    phaseEl.textContent = PHASES[p];
    countEl.textContent = Math.min(PHASE, Math.floor(f * PHASE) + 1);
    roundEl.textContent = `Round ${Math.min(ROUNDS, Math.floor(t / CYCLE) + 1)} / ${ROUNDS}`;
    leftEl.textContent = fmt(TOTAL - t);
  }

  function tick(now) {
    if (!running) return;
    elapsed += (now - last) / 1000;
    last = now;
    if (elapsed >= TOTAL) { finish(); return; }
    render(elapsed);
    raf = requestAnimationFrame(tick);
  }

  function start() {
    if (elapsed >= TOTAL) elapsed = 0;
    running = true;
    last = performance.now();
    btn.textContent = 'Pause';
    raf = requestAnimationFrame(tick);
  }

  function pause() {
    running = false;
    cancelAnimationFrame(raf);
    btn.textContent = elapsed > 0 ? 'Resume' : 'Start';
    phaseEl.textContent = 'Paused';
  }

  function finish() {
    running = false;
    elapsed = TOTAL;
    dot.setAttribute('cx', 0); dot.setAttribute('cy', 0);
    fill.style.setProperty('--s', 0);
    phaseEl.textContent = 'Done';
    countEl.textContent = '·';
    roundEl.textContent = `Round ${ROUNDS} / ${ROUNDS}`;
    leftEl.textContent = '0:00';
    btn.textContent = 'Again';
  }

  const toggle = () => running ? pause() : start();
  btn.addEventListener('click', toggle);
  box.addEventListener('click', toggle);
  document.addEventListener('keydown', e => {
    if (e.code === 'Space' && !e.repeat) { e.preventDefault(); toggle(); }
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden && running) pause(); });
})();
</script>
</body>
</html>
