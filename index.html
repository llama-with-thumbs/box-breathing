<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Box Breathing</title>
<meta name="description" content="Two minutes of box breathing: inhale 4, hold 4, exhale 4, hold 4.">
<meta name="theme-color" content="#f4f1ea">
<style>
  :root {
    --bg: #ece9e2;          /* pale ceiling */
    --fg: #1a1a1a;
    --muted: #7a766e;
    --on: #ffffff;          /* text on the light */
    --l0: 48; --l1: 64;     /* lightness of the light: exhaled, inhaled */
    --glow: .35;
    --h: 215;               /* hue of the light; drifts over the session */
    --light: hsl(var(--h) 60% 44%);
    --ink: hsl(var(--h) 70% 72%);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b0c10; --fg: #ece9e2; --muted: #8a877f; --l0: 26; --l1: 44; --glow: .6; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 300 18px/1.4 system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    transition: background 1s;
    display: grid;
    place-items: center;
    padding: 16px;
    -webkit-tap-highlight-color: transparent;
  }
  main { width: min(100%, 420px); display: grid; gap: 36px; justify-items: center; text-align: center; }
  h1 { font-size: 13px; font-weight: 500; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }

  .box {
    position: relative; width: min(72vw, 300px); aspect-ratio: 1; cursor: pointer; user-select: none;
    --l: var(--l0);
    background: hsl(var(--h) 60% calc(var(--l) * 1%));
    box-shadow: 0 0 90px hsl(var(--h) 60% calc(var(--l) * 1%) / var(--glow));
  }
  .box svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; }
  .dot { fill: var(--on); opacity: .9; }

  .label { position: absolute; inset: 0; display: grid; place-content: center; gap: 8px; pointer-events: none; color: var(--on); }
  .phase { font-size: 15px; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; opacity: .85; }
  .count { font-size: 64px; font-weight: 200; line-height: 1; font-variant-numeric: tabular-nums; }

  .meta { display: flex; gap: 32px; color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; }

  button {
    font: inherit; font-size: 14px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase;
    border: 0; background: var(--fg); color: var(--bg);
    padding: 12px 32px; cursor: pointer; border-radius: 0;
  }
  button:hover, button:focus-visible { opacity: .85; outline: none; }

  .hint { color: var(--muted); font-size: 14px; }
  /* the way to the other instrument: one grey word, last on the page */
  .x { display: inline-flex; align-items: center; min-height: 44px; padding: 10px 8px; color: var(--muted); font-size: 12px; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; text-decoration: none; }
  .x:hover, .x:focus-visible { color: var(--fg); outline: none; }

  .row { display: flex; gap: 20px; align-items: center; justify-content: center; flex-wrap: wrap; }
  /* sound switch: a small square of light, the word lit by it */
  .snd { display: inline-flex; align-items: center; gap: 12px; padding: 8px 4px; min-height: 44px; background: none; border: 0; color: var(--muted); letter-spacing: .1em; }
  .snd:hover, .snd:focus-visible { opacity: 1; outline: none; }
  .snd:focus-visible .sq { outline: 2px solid var(--fg); outline-offset: 3px; }
  .snd .sq { display: block; width: 18px; height: 18px; border: 2px solid var(--fg); box-sizing: border-box; transition: background .4s, border-color .4s, box-shadow .4s, transform .15s; }
  .snd:active .sq { transform: scale(.85); }
  .snd[aria-pressed="true"] .sq { background: var(--light); border-color: var(--light); box-shadow: 0 0 16px var(--light); }
  .snd .word { display: inline-grid; grid-auto-flow: column; align-items: baseline; transition: color .5s, text-shadow .5s; }
  .snd .word > :first-child { grid-area: 1 / 1; white-space: pre; }
  .snd .on, .snd .off { grid-area: 1 / 2; visibility: hidden; }
  .snd[aria-pressed="true"] .on { visibility: visible; }
  .snd[aria-pressed="false"] .off { visibility: visible; }
  .snd[aria-pressed="true"] .word { color: var(--ink); text-shadow: 0 0 12px hsl(var(--h) 80% 60% / .7); }

  @media (prefers-reduced-motion: reduce) { .box { box-shadow: none; } }
</style>
</head>
<body>
<main>
  <h1>Box breathing · 2 minutes</h1>

  <div class="box" id="box" title="Click to start or pause">
    <svg viewBox="0 0 100 100" role="img" aria-label="A square of light; it brightens as you inhale, dims as you exhale; a dot travels one edge per phase">
      <circle class="dot" id="dot" cx="0" cy="0" r="3"/>
    </svg>
    <div class="label" aria-live="polite">
      <div class="phase" id="phase">Ready</div>
      <div class="count" id="count">4 · 4 · 4 · 4</div>
    </div>
  </div>

  <div class="meta">
    <span id="round">Round 0 / 11</span>
    <span id="left">2:08</span>
  </div>

  <div class="row">
    <button id="btn" type="button">Start</button>
    <button id="snd" type="button" class="snd" aria-pressed="true"><span class="sq"></span><span class="word"><span>Sound </span><span class="on">on</span><span class="off">off</span></span></button>
  </div>
  <p class="hint">Inhale 4 · Hold 4 · Exhale 4 · Hold 4. Space starts or pauses. The tone rises as you breathe in; a click marks each corner.</p>
  <a class="x" href="unclench.html">Unclench →</a>
</main>

/+T/5P/l/+b/6P/q/+7/8f/1//j/+//9////AAAAAA=='];   // one per side: inhale, top, exhale, bottom (8.0x, 7.3x, 8.6x, 9.3x slow; 180-350 Hz, edge faded in)
  const bufs = {};
  const WAVS = { switch: SWITCH_WAV }; CORNER_WAVS.forEach((w, i) => { WAVS['corner' + i] = w; });
  const anyAudio = () => {                      // like audio(), but ignores the sound setting: the switch always clicks
    try {
      if (!ctx) ctx = mkCtx();
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    } catch (e) { return null; }
  };
  function play(key, b64, gain, always) {
    const c = always ? anyAudio() : audio(); if (!c) return;
    const go = buf => { const s = c.createBufferSource(), g = c.createGain(); s.buffer = buf; g.gain.value = gain; s.connect(g).connect(c.destination); duck(Math.min(0.5, buf.duration)); s.start(); };   // the duck covers the hit, not the room tail
    if (bufs[key]) return go(bufs[key]);
    const bin = atob(b64), arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    c.decodeAudioData(arr.buffer, buf => { bufs[key] = buf; go(buf); }, () => {});
  }
  // decode both at load, off the main context (no tap needed), so the first play is on time
  try {
    const off = new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(1, 8, 44100);   // 44.1 k: every Safari accepts it (older ones refuse 8 k)
    for (const [key, b64] of Object.entries(WAVS)) {
      const bin = atob(b64), arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      off.decodeAudioData(arr.buffer, buf => { bufs[key] = buf; }, () => {});
    }
  } catch (e) {}
  const switchClick = () => play('switch', SWITCH_WAV, 0.9, true);
  const cornerClick = side => play('corner' + side, CORNER_WAVS[side], 0.8, false);
  sndBtn.addEventListener('click', e => {
    e.stopPropagation();
    sound = !sound; showSound();
    try { localStorage.setItem('instruments.sound', sound ? 'on' : 'off'); } catch (e) {}
    switchClick(); if (!sound) toneOff();
  });

  // the tone: a low sine with its octave under it, no attack. An octave pair, not a fifth: a fifth pulses at
  // the difference (110 Hz), which a phone speaker turns into buzz. Pitch follows the breath, one semitone, slowly.
  let osc1 = null, osc2 = null, gain = null, dip = null;
  function toneOn() {
    const c = audio(); if (!c || osc1) return;
    gain = c.createGain(); gain.gain.setValueAtTime(0, c.currentTime);
    gain.gain.linearRampToValueAtTime(0.45, c.currentTime + 2);
    osc1 = c.createOscillator(); osc1.type = 'sine'; osc1.frequency.value = 220;
    osc2 = c.createOscillator(); osc2.type = 'sine'; osc2.frequency.value = 440;
    const g2 = c.createGain(); g2.gain.value = 0.4;
    dip = c.createGain();                       // the tone steps aside while a click sounds; together they would clip
    osc1.connect(gain); osc2.connect(g2).connect(gain); gain.connect(dip).connect(c.destination);
    osc1.start(); osc2.start();
  }
  function tonePitch(b) {                       // b: 0 exhaled .. 1 inhaled -> up to one semitone
    if (!osc1) return;
    const f = 220 * Math.pow(2, b / 12);
    osc1.frequency.setTargetAtTime(f, ctx.currentTime, 0.3);
    osc2.frequency.setTargetAtTime(f * 2, ctx.currentTime, 0.3);
  }
  function duck(sec) {                          // tone to 30 % in 10 ms, back over 150 ms after the click
    if (!dip) return;
    const t = ctx.currentTime;
    dip.gain.cancelScheduledValues(t); dip.gain.setTargetAtTime(0.3, t, 0.01); dip.gain.setTargetAtTime(1, t + sec, 0.05);
  }
  function toneOff() {
    if (!osc1) return;
    const o1 = osc1, o2 = osc2, g = gain, t = ctx.currentTime; osc1 = osc2 = gain = dip = null;
    g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(g.gain.value, t);
    g.gain.linearRampToValueAtTime(0, t + 1.5);
    o1.stop(t + 1.6); o2.stop(t + 1.6);
  }

  // Keep the phone's screen on while the timer runs (Android Chrome/Firefox, HTTPS).
  // Released on pause, finish, or when the tab is hidden. Nothing happens if unsupported.
  let lock = null;
  async function keepAwake() {
    try { if (!lock && navigator.wakeLock) { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => { lock = null; }); } } catch (e) {}
  }
  function letSleep() { if (lock) { lock.release().catch(() => {}); lock = null; } }

  const fmt = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

  function render(t) {
    const inCycle = t % CYCLE;
    const p = Math.floor(inCycle / PHASE);          // 0..3: which side
    const f = (inCycle - p * PHASE) / PHASE;        // 0..1 along that side
    if (running && p !== lastSide) { const first = lastSide < 0; lastSide = p; if (!first) cornerClick(p); }  // each corner its own click; none at Start, that corner is the press itself
    let cx, cy;
    if (p === 0)      { cx = f * 100;       cy = 0; }          // top, left → right
    else if (p === 1) { cx = 100;           cy = f * 100; }    // right, down
    else if (p === 2) { cx = 100 - f * 100; cy = 100; }        // bottom, right → left
    else              { cx = 0;             cy = 100 - f * 100; } // left, up
    dot.setAttribute('cx', cx);
    dot.setAttribute('cy', cy);
    // the light breathes: up on inhale, held, down on exhale, held
    const b = p === 0 ? f : p === 1 ? 1 : p === 2 ? 1 - f : 0;
    const ease = b * b * (3 - 2 * b);
    box.style.setProperty('--l', L0 + (L1 - L0) * ease);
    tonePitch(ease);
    // and its hue drifts over the session: blue → violet → rose → back to blue
    root.style.setProperty('--h', 215 + 110 * (0.5 - 0.5 * Math.cos(2 * Math.PI * t / TOTAL)));
    phaseEl.textContent = PHASES[p];
    countEl.textContent = Math.min(PHASE, Math.floor(f * PHASE) + 1);
    roundEl.textContent = `Round ${Math.min(ROUNDS, Math.floor(t / CYCLE) + 1)} / ${ROUNDS}`;
    leftEl.textContent = fmt(TOTAL - t);
  }

  function tick(now) {
    if (!running) return;
    elapsed += (now - last) / 1000;
    last = now;
    if (elapsed >= TOTAL) { finish(); return; }
    render(elapsed);
    raf = requestAnimationFrame(tick);
  }

  function start() {
    if (elapsed >= TOTAL) { elapsed = 0; lastSide = -1; }
    running = true;
    last = performance.now();
    btn.textContent = 'Pause';
    keepAwake();
    toneOn();
    raf = requestAnimationFrame(tick);
  }

  function pause() {
    running = false;
    cancelAnimationFrame(raf);
    letSleep();
    toneOff();
    btn.textContent = elapsed > 0 ? 'Resume' : 'Start';
    phaseEl.textContent = 'Paused';
  }

  function finish() {
    running = false;
    letSleep();
    toneOff();
    elapsed = TOTAL; lastSide = -1;
    dot.setAttribute('cx', 0); dot.setAttribute('cy', 0);
    box.style.setProperty('--l', L0); root.style.setProperty('--h', 215);
    phaseEl.textContent = 'Done';
    countEl.textContent = '·';
    roundEl.textContent = `Round ${ROUNDS} / ${ROUNDS}`;
    leftEl.textContent = '0:00';
    btn.textContent = 'Again';
  }

  const toggle = () => running ? pause() : start();
  btn.addEventListener('click', toggle);
  box.addEventListener('click', toggle);
  document.addEventListener('keydown', e => {
    if (e.code === 'Space' && !e.repeat) { e.preventDefault(); toggle(); }
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden && running) pause(); });
})();
