<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sit</title>
<meta name="description" content="Under three minutes: a voice walks you through sitting with anxiety. Body, facts, mind, kindness, here.">
<meta name="theme-color" content="#f4f1ea">
<style>
  :root {
    --bg: #ece9e2; --fg: #1a1a1a; --muted: #7a766e; --on: #ffffff;
    --l: 46; --glow: .35;
    --h: 215;               /* hue of the light; drifts over the session */
    --light: hsl(var(--h) 60% 44%);
    --ink: hsl(var(--h) 70% 72%);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b0c10; --fg: #ece9e2; --muted: #8a877f; --l: 30; --glow: .6; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font: 300 18px/1.4 system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    display: grid; place-items: center; padding: 16px;
    -webkit-tap-highlight-color: transparent;
  }
  main { width: min(100%, 420px); display: grid; gap: 36px; justify-items: center; text-align: center; }
  h1 { font-size: 13px; font-weight: 500; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }

  /* the square holds still: it is the seat. The dot walks its edge once over the whole sitting. */
  .box {
    position: relative; width: min(76vw, 310px); aspect-ratio: 1; cursor: pointer; user-select: none;
    background: hsl(var(--h) 60% calc(var(--l) * 1%));
    box-shadow: 0 0 90px hsl(var(--h) 60% calc(var(--l) * 1%) / var(--glow));
  }
  .box svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; }
  .dot { fill: var(--on); opacity: .9; }
  .label { position: absolute; inset: 0; display: grid; place-content: center; gap: 14px; padding: 22px; pointer-events: none; color: var(--on); }
  .phase { font-size: 13px; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; opacity: .8; }
  .line { font-size: min(21px, 5.4vw); font-weight: 300; line-height: 1.35; text-wrap: balance; transition: opacity .6s; }
  .line.out { opacity: 0; }

  .meta { display: flex; gap: 32px; color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; }
  button {
    font: inherit; font-size: 14px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase;
    border: 0; background: var(--fg); color: var(--bg); padding: 12px 32px; cursor: pointer; border-radius: 0;
  }
  button:hover, button:focus-visible { opacity: .85; outline: none; }
  .hint { color: var(--muted); font-size: 14px; }
  .x { display: inline-flex; align-items: center; min-height: 44px; padding: 10px 8px; color: var(--muted); font-size: 12px; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; text-decoration: none; }
  .x:hover, .x:focus-visible, .x[aria-current] { color: var(--fg); outline: none; }
  .nav { display: flex; align-items: center; justify-content: center; }   /* a carousel: Box, Unclench, Hexagon, Sit, round and round */
  .nav .x { justify-content: center; }
  .nav a.x { min-width: 44px; font-size: 16px; letter-spacing: 0; }
  .nav span.x { width: 11em; }

  .row { display: flex; gap: 20px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .snd { display: inline-flex; align-items: center; gap: 12px; padding: 8px 4px; min-height: 44px; background: none; border: 0; color: var(--muted); letter-spacing: .1em; }
  .snd:hover, .snd:focus-visible { opacity: 1; outline: none; }
  .snd:focus-visible .sq { outline: 2px solid var(--fg); outline-offset: 3px; }
  .snd .sq { display: block; width: 18px; height: 18px; border: 2px solid var(--fg); box-sizing: border-box; transition: background .4s, border-color .4s, box-shadow .4s, transform .15s; }
  .snd:active .sq { transform: scale(.85); }
  .snd[aria-pressed="true"] .sq { background: var(--light); border-color: var(--light); box-shadow: 0 0 16px var(--light); }
  .snd .word { display: inline-grid; grid-auto-flow: column; align-items: baseline; transition: color .5s, text-shadow .5s; }
  .snd .word > :first-child { grid-area: 1 / 1; white-space: pre; }
  .snd .on, .snd .off { grid-area: 1 / 2; visibility: hidden; }
  .snd[aria-pressed="true"] .on { visibility: visible; }
  .snd[aria-pressed="false"] .off { visibility: visible; }
  .snd[aria-pressed="true"] .word { color: var(--ink); text-shadow: 0 0 12px hsl(var(--h) 80% 60% / .7); }
  @media (prefers-reduced-motion: reduce) { .line { transition: none; } }
</style>
</head>
<body>
<main>
  <h1>Sit · under 3 minutes</h1>

  <div class="box" id="box" title="Click to start or pause">
    <svg viewBox="0 0 100 100" role="img" aria-label="A square of light that holds still; a dot travels its edge once over the sitting">
      <circle class="dot" id="dot" cx="0" cy="0" r="3"/>
    </svg>
    <div class="label" aria-live="polite">
      <div class="phase" id="phase">Ready</div>
      <div class="line" id="line">Sit with it. Nothing to fix.</div>
    </div>
  </div>

  <div class="meta">
    <span id="round">Part 0 / 5</span>
    <span id="left">2:40</span>
  </div>

  <div class="row">
    <button id="btn" type="button">Start</button>
    <button id="snd" type="button" class="snd" aria-pressed="true"><span class="sq"></span><span class="word"><span>Voice </span><span class="on">on</span><span class="off">off</span></span></button>
  </div>
  <p class="hint">This device's own voice reads each line; the words are on the square either way. The aim is to stay, not to make it go. Space starts or pauses.</p>
  <nav class="nav" aria-label="Instruments"><a class="x" href="hexagon.html" aria-label="Previous: Hexagon">←</a><span class="x" aria-current="page">Sit</span><a class="x" href="index.html" aria-label="Next: Box">→</a></nav>
</main>

<script>
(() => {
  // ---- the script: [part, line, seconds until the next line]. Change the sitting here and nowhere else. ----
  // The five parts follow Jenny Matthews, LMFT, "How to sit with anxiety" (State of Mind Therapy): curious about
  // the body, call the sensation what it is, curious about the mind, encouraging not critical; then feet and room.
  const LINES = [
    ['Body',  'Find where it sits in your body.', 8],
    ['Body',  'Chest. Stomach. Throat. Hands.', 8],
    ['Body',  'Name what is there, in plain words. Tight. Hot. Fluttering.', 10],
    ['Body',  'Watch it. Nothing to fix.', 14],
    ['Facts', 'This is a sensation.', 8],
    ['Facts', 'It is uncomfortable. It is not an emergency.', 10],
    ['Facts', 'If the mind runs ahead, come back to what is here.', 12],
    ['Mind',  'Now the thoughts. Watch them like a show.', 10],
    ['Mind',  'Is it predicting? Wanting to be sure? Solving? Asking for reassurance?', 14],
    ['Mind',  'Name the kind. Stay in your seat.', 16],
    ['Kind',  'Say to yourself what you would say to a friend.', 10],
    ['Kind',  'This is hard. I can be here with it.', 10],
    ['Kind',  'It can stay as long as it stays.', 10],
    ['Here',  'Feel your feet. Your weight in the seat.', 10],
    ['Here',  'Look at one thing in the room.', 10],
  ];
  const RATE = 0.85;                                // speaking rate; 1 is the device's normal
  const PARTS = [...new Set(LINES.map(l => l[0]))];
  const STARTS = []; let TOTAL = 0; for (const l of LINES) { STARTS.push(TOTAL); TOTAL += l[2]; }
  const V = [[0, 0], [100, 0], [100, 100], [0, 100]];   // corners, clockwise from the top left

  const $ = id => document.getElementById(id);
  const dot = $('dot'), box = $('box'), btn = $('btn');
  const phaseEl = $('phase'), lineEl = $('line'), roundEl = $('round'), leftEl = $('left');
  const root = document.documentElement;
  let running = false, elapsed = 0, last = 0, raf = 0, lastLine = -1;

  // ---- sound: the device's voice, and one recorded click for the switch. Nothing sounds before a tap. ----
  let ctx = null, sound = true;
  try { sound = localStorage.getItem('instruments.sound') !== 'off'; } catch (e) {}
  const sndBtn = $('snd');
  const showSound = () => sndBtn.setAttribute('aria-pressed', String(sound));
  showSound();
  const mkCtx = () => {                         // on iPhone the 'playback' session keeps the ring switch from muting it
    const c = new (window.AudioContext || window.webkitAudioContext)();
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
    return c;
  };
  const anyAudio = () => { try { if (!ctx) ctx = mkCtx(); if (ctx.state === 'suspended') ctx.resume(); return ctx; } catch (e) { return null; } };
  const SWITCH_WAV = 'UklGRoILAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YV4LAAAWABYA/f/s/9f/xf+z/6H/kP9//27/X/9R/0T/Of8x/yz/K/8v/zn/SP9e/3j/l/+6/97/AgAlAEYAYwB5AIUAiAB/AGgAQwAQANL/hf8v/9D+bf4K/qr9Uf0D/cT8mPyC/IX8ofzX/Cf9j/0N/p/+P//p/5cARgHxAZICJQOlAw8EYQSaBLkEwASxBJAEYQQqBPEDvQOWA4IDiAOwA/8DfQQtBRAGJQdoCM8JTwvYDFUOsQ/UEKQRBhLiESERrw9+DYQKvwY2Avj8Gfe58ALqIeNM3LzVqs9SyuzFqcK2wDTAO8HZwwvIw83n1EzdweYH8eD7AAcnEgwdbycVMcg5X0G2R7RMR1BmUhNTU1I1UM1MNEiHQuo7gTRzLOsjFBsXEh8JUwDY98fvP+hO4QPbX9Vh0P/LLsjaxPPBaL8pvS27crn5t9G2C7bEtR22Obc9uU+8jMAMxt/MBtV33hzpzfRXAXwO8xtoKYk2AEN+TrlYcGFwaJNtv3DqcRhxVW67aWpji1tJUtZHYzwnMFQjIhbECHL7W+624bLVgcpPwES3ha8uqVakDKFUnyufhaBNo2anrqz+siu6CcJwyjbTONxS5Wzua/c9ANQIIxEdGbgg5iecLsk0Wzo9P1pDmkbpSDJKZkp5SWhHNUTqP5c6WDRJLZMlXB3TFCQMfQMI++zyTOtI5PndctjC0/TPC80Jy+3Jr8lIyq3L0M2k0BnUG9iW3HfhpuYK7IvxDvd5/LABngYrC0QP1xLZFUEYCxo3G8wb0RtTG2EaDRlqF4oVfxNbESsP/wzfCtYI6AYbBXED7AGNAFT/Pv5L/Xj8xvs0+7/6aPou+g/6C/oe+kf6gvrL+h/7fPvb+zz8mvzy/EH9h/3B/e/9D/4h/ij+Iv4T/vr92/22/Y79Zf09/Rj9+fzg/NH8zPzT/Oj8Cv07/Xv9y/0p/pf+Ev+Z/ycAwABfAf8BnwI8A9QDYwTnBF0FxQUcBmAGkQasBrAGnAZwBioGywVUBcUEIARoA58CyQHqAAgAKP9M/nv9t/wG/Gv76Pp/+jH6//np+e75DvpF+pL69Ppl++X7cfwE/Z39Of7V/nD/AwCSABkBlgEHAmoCvgIBAzEDTgNYA00DMAMCA8MCeAIkAskBbAEPAbcAZQAdAOH/r/+I/2z/W/9T/1L/V/9i/3L/hf+c/7b/0v/v/woAJQA+AFMAYwBtAHIAcQBsAGIAVgBIADgAKQAZAAkA+//s/9v/y/+6/6j/lv+E/3T/Zv9a/1H/S/9J/0n/S/9P/1P/V/9b/1//ZP9r/3X/hf+b/7n/3/8KAD0AdQCtAOMAEwE5AVQBYAFfAVABNQESAekAvQCTAGwASwAwABwADgAGAAEAAAD+//v/9f/r/9z/yP+v/5L/cv9S/zP/GP8D//f+8/75/gr/Jf9L/3r/r//n/x8AVACBAKMAtwC7ALAAlQBvAEAADwDi/7n/mv+J/4X/jf+h/7v/2v/4/xIAKAA3AD4APQAzACQAEQD+/+n/2P/L/8T/xP/L/9f/6P/9/xIALABFAGAAeQCPAKEArACtAKMAjABoADcA/v++/33/Qv8S//T+6v73/hv/Uv+Y/+T/LgBwAKMAwQDGALMAiQBOAAgAwP96/0H/Gf8I/w7/LP9e/5//6f80AHwAuADkAPsA/gDsAMgAlgBcAB4A5v+z/4v/cP9k/2b/d/+V/73/7f8fAFIAfgCgALEArwCYAGwALgDl/5P/Qv/7/sT+pf6g/rf+6f4z/47/8P9RAKoA8AAeAS8BIgH7AL4AcgAgANX/lv9r/1v/aP+Q/87/GQBqALgA9wAhATIBJQH+AMEAdAAeAMv/fv9A/xj/Bv8M/yf/VP+N/8v/BwA+AGoAhwCSAI0AdgBTACUA9P/B/5H/a/9P/0D/P/9M/2T/hv+v/9z/CAAzAFoAegCRAJ4AogCcAJAAgQBxAGMAWwBcAGUAdwCRAK4AzADmAPYA+gDwANYArwB7AD8AAADC/4f/Vv8x/xr/FP8d/zT/Vv9//6n/0v/0/wwAGwAhAB8AFgAKAP7/8//p/+T/4v/m/+3/9/8CAA8AGwAmAC8ANAA2ADYANAAxAC8ALgAtAC4ALgAsACYAGwALAPj/4P/G/7D/n/+W/5j/pf+//+X/EwBIAH8AsADVAOgA4gDBAIUAMADN/2D/9f6X/kz+G/4H/g7+Mf5r/rr+Gf+F//r/cgDrAF4BxQEbAloCgAKKAngCSwIGAq4BSQHdAHIADgC2/2r/Lf/8/tf+t/6b/n7+Xf42/gz+3/21/ZX9hv2Q/b39D/6J/ir/6P+3AIsBTgLvAlwDiQNuAwkDYAKBAX4Acf9u/o795/yJ/H/8zvxy/WP+j//gAD0CiQOkBHIF2gXIBTAFEgR3AncANP7a+5/5vfdp9tP1G/ZM91r5Jvx1/wEDfAaSCfkLdQ3hDTENdgvaCJwFBwJs/gz7IvjR9S70PfP78l/zZPQF9jj47Pr//T8BbgQ/B2oJsgr2CjMKhwgxBn8DzABt/qP8nvtv+w/8XP0k/yYBIgPUBAEGewYkBvIE9QJQAD/9DfoR96b0HfO08o7zqvXm+P78jwEwBmwK2A0eEAURdBB5DkYLJgd8ArH9J/k69SzyKvBH74Pv0PAU8yz27vkh/oICxQaRCo0Nbw//DykP/QyzCZ8FLwHU/Pj49/UR9GTz8/Og9TP4Zvvl/loCeAX6B6wJbwo7Ch0JOAfCBPwBL/+g/I36I/l7+Jj4Zfm8+mr8Of71/3ABjAIyA10DEwNmAnABVAA4/z3+iP0u/T39tv2L/qb/5gAtAlkDTATyBDkFHQWfBMYDogJEAcf/P/7G/Hf7aPqt+Vf5bfny+d/6I/yn/U3/9AB+As0DyQRhBY0FTgWuBLoDiwI5AeT/pf6U/cf8TPwm/FT8zvyG/W3+b/93AHUBVQIIA4ADtAOjA00DuALxAQYBCQAM/yH+Wf3E/G78XPyQ/AL9qf1z/k3/IwDkAIAB7QEiAiAC6QGGAQMBbwDc/1f/7/6u/pz+uP7//mn/6v9zAPkAawG9AeYB4AGqAUsBywA7AKr/J//A/oD+b/6N/tb+Qv/D/0gAxAAlAV0BYwE1AdYAUQC2/xT/f/4J/r/9qP3H/Rn+lP4u/9b/fAAVAZEB6AEUAhUC7wGnAUgB3QBvAAoAuP99/13/Wv9y/6H/3v8hAGUAoQDPAOkA7gDeALoAhQBFAAAAvP+B/1X/PP84/0r/bv+f/9f/DQA9AGAAcgBwAFoAMgAAAMf/jv9d/zr/Kv8v/0f/b/+j/9v/EQBBAGQAeAB6AGwAUgAuAAcA5P/H/7b/sv+9/9X/9/8eAEkAcACQAKYArgCoAJYAegBWADAADADu/9b/yP/C/8X/zv/a/+b/8P/1//T/7f/e/8v/tf+g/4//g/+A/4T/kf+l/77/2P/z/wgAGwAoAC4ALgAnAB0AEAACAPb/6v/h/9r/2P/Y/9z/4//s//f/AwARACAALgA5AEMASABIAEQAOwAtABsACAD2/+T/1//O/8v/z//Y/+X/9P8AAAwAFAAWABIACgD///L/5f/c/9j/2v/l//f/DgAqAEcAYwB5AIcAjgCKAH4AbABUADsAIQALAPv/7v/m/+T/5f/o/+v/7v/v/+z/5//g/9j/0P/J/8b/xv/K/9L/3P/n//H/+v8AAAIABAAFAAYACAALABAAGAAgACkAMQA4ADwAPgA9ADkAMwArACIAGQASAA0ACwALAA4AEgAXABsAHwAfAB0AGAAQAAcA/f/z/+n/4f/b/9j/1//Y/9v/3//i/+X/6P/p/+r/6//r/+z/7v/w//P/9//7/wAAAgAGAAgACgAKAAoACQAIAAYABQADAAIAAQABAAAAAAA=';
  let switchBuf = null;
  const bytes = () => { const bin = atob(SWITCH_WAV), arr = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i); return arr.buffer; };
  try { new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(1, 8, 44100).decodeAudioData(bytes(), b => { switchBuf = b; }, () => {}); } catch (e) {}
  function switchClick() {                      // the switch always clicks, whatever the setting
    const c = anyAudio(); if (!c) return;
    const go = buf => { const s = c.createBufferSource(), g = c.createGain(); s.buffer = buf; g.gain.value = 0.9; s.connect(g).connect(c.destination); s.start(); };
    if (switchBuf) return go(switchBuf);
    c.decodeAudioData(bytes(), b => { switchBuf = b; go(b); }, () => {});
  }

  // the voice: whatever English voice the device has, one kept on the device preferred (works offline)
  const synth = window.speechSynthesis || null;
  let voice = null;
  function pickVoice() {
    if (!synth) return;
    const en = synth.getVoices().filter(v => /^en/i.test(v.lang));
    voice = en.find(v => v.localService && v.default) || en.find(v => v.localService) || en[0] || null;
  }
  if (synth) { pickVoice(); try { synth.addEventListener('voiceschanged', pickVoice); } catch (e) {} }
  function hush() { try { if (synth) synth.cancel(); } catch (e) {} }
  function say(text) {
    if (!sound || !synth || !window.SpeechSynthesisUtterance) return;
    try {
      synth.cancel();
      const u = new SpeechSynthesisUtterance(text);
      if (voice) { u.voice = voice; u.lang = voice.lang; } else u.lang = 'en-US';
      u.rate = RATE; u.pitch = 0.9; u.volume = 1;
      synth.speak(u);
    } catch (e) {}
  }
  sndBtn.addEventListener('click', e => {
    e.stopPropagation();
    sound = !sound; showSound();
    try { localStorage.setItem('instruments.sound', sound ? 'on' : 'off'); } catch (e) {}
    switchClick();
    if (!sound) hush(); else if (running && lastLine >= 0) say(LINES[lastLine][1]);
  });

  // Keep the phone's screen on while the timer runs. Released on pause, finish, or when the tab is hidden.
  let lock = null;
  async function keepAwake() {
    try { if (!lock && navigator.wakeLock) { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => { lock = null; }); } } catch (e) {}
  }
  function letSleep() { if (lock) { lock.release().catch(() => {}); lock = null; } }

  const fmt = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  const lineAt = t => { let i = 0; while (i + 1 < LINES.length && STARTS[i + 1] <= t) i++; return i; };

  function place(t) {                               // the dot: once round the square over the whole sitting
    const u = Math.min(0.9999, t / TOTAL) * 4, p = Math.floor(u), f = u - p, a = V[p], b = V[(p + 1) % 4];
    dot.setAttribute('cx', a[0] + (b[0] - a[0]) * f);
    dot.setAttribute('cy', a[1] + (b[1] - a[1]) * f);
  }
  function render(t) {
    const i = lineAt(t);
    if (i !== lastLine) {
      lastLine = i;
      phaseEl.textContent = LINES[i][0];
      lineEl.textContent = LINES[i][1];
      roundEl.textContent = `Part ${PARTS.indexOf(LINES[i][0]) + 1} / ${PARTS.length}`;
      say(LINES[i][1]);
    }
    place(t);
    root.style.setProperty('--h', 215 + 110 * (0.5 - 0.5 * Math.cos(2 * Math.PI * t / TOTAL)));
    leftEl.textContent = fmt(TOTAL - t);
  }

  function tick(now) {
    if (!running) return;
    const dt = Math.max(0, (now - last) / 1000);
    elapsed += dt; last = now;
    if (elapsed >= TOTAL) { finish(); return; }
    render(elapsed);
    raf = requestAnimationFrame(tick);
  }
  function start() {
    if (elapsed >= TOTAL) elapsed = 0;
    else elapsed = STARTS[lineAt(elapsed)];         // a resume goes back to the start of the line it stopped in
    lastLine = -1;
    running = true; last = performance.now();
    btn.textContent = 'Pause';
    keepAwake();
    render(elapsed);                                // the first line speaks inside the tap, which phones require
    raf = requestAnimationFrame(tick);
  }
  function pause() {
    running = false; cancelAnimationFrame(raf);
    letSleep(); hush();
    btn.textContent = elapsed > 0 ? 'Resume' : 'Start';
    phaseEl.textContent = 'Paused';
  }
  function finish() {
    running = false; letSleep();
    elapsed = TOTAL; lastLine = -1;
    place(0); root.style.setProperty('--h', 215);
    phaseEl.textContent = 'Done'; lineEl.textContent = 'You stayed.';
    roundEl.textContent = `Part ${PARTS.length} / ${PARTS.length}`; leftEl.textContent = '0:00';
    btn.textContent = 'Again';
  }

  const toggle = () => running ? pause() : start();
  btn.addEventListener('click', toggle);
  box.addEventListener('click', toggle);
  document.addEventListener('keydown', e => { if (e.code === 'Space' && !e.repeat) { e.preventDefault(); toggle(); } });
  document.addEventListener('visibilitychange', () => { if (document.hidden && running) pause(); });
  window.addEventListener('pagehide', hush);
  leftEl.textContent = fmt(TOTAL);
})();
</script>
</body>
</html>
