<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sit</title>
<meta name="description" content="Under three minutes: a voice walks you through sitting with anxiety. Body, facts, mind, kindness, here.">
<meta name="theme-color" content="#f4f1ea">
<style>
  :root {
    --bg: #ece9e2; --fg: #1a1a1a; --muted: #7a766e; --on: #ffffff;
    --l: 46; --glow: .35;
    --h: 215;               /* hue of the light; drifts over the session */
    --light: hsl(var(--h) 60% 44%);
    --ink: hsl(var(--h) 70% 72%);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b0c10; --fg: #ece9e2; --muted: #8a877f; --l: 30; --glow: .6; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font: 300 18px/1.4 system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    display: grid; place-items: center; padding: 16px;
    -webkit-tap-highlight-color: transparent;
  }
  main { width: min(100%, 420px); display: grid; gap: 36px; justify-items: center; text-align: center; }
  h1 { font-size: 13px; font-weight: 500; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }

  /* the square holds still: it is the seat. The dot walks its edge once over the whole sitting. */
  .box {
    position: relative; width: min(72vw, 300px); aspect-ratio: 1; cursor: pointer; user-select: none;
    background: hsl(var(--h) 60% calc(var(--l) * 1%));
    box-shadow: 0 0 90px hsl(var(--h) 60% calc(var(--l) * 1%) / var(--glow));
  }
  .box svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; }
  .dot { fill: var(--on); opacity: .9; }
  .label { position: absolute; inset: 0; display: grid; place-content: center; gap: 14px; padding: 22px; pointer-events: none; color: var(--on); }
  .phase { font-size: 13px; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; opacity: .8; }
  .line { font-size: min(21px, 5.4vw); font-weight: 300; line-height: 1.35; text-wrap: balance; transition: opacity .6s; }
  .line.out { opacity: 0; }

  .meta { display: flex; gap: 32px; color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; }
  button {
    font: inherit; font-size: 14px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase;
    border: 0; background: var(--fg); color: var(--bg); padding: 12px 32px; cursor: pointer; border-radius: 0;
  }
  button:hover, button:focus-visible { opacity: .85; outline: none; }
  #btn { min-width: 140px; } #snd { min-width: 128px; }                      /* same on every page: the label changes, the button and the switch do not move */
  .hint { color: var(--muted); font-size: 14px; min-height: 4.2em; }   /* room for three lines on every page, so the carousel sits at one height */
  .x { display: inline-flex; align-items: center; min-height: 44px; padding: 10px 8px; color: var(--muted); font-size: 12px; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; text-decoration: none; }
  .x:hover, .x:focus-visible, .x[aria-current] { color: var(--fg); outline: none; }
  .nav { display: flex; align-items: center; justify-content: center; }   /* a carousel: Box, Unclench, Hexagon, Sit, round and round */
  .nav .x { justify-content: center; }
  .nav a.x { min-width: 44px; font-size: 16px; letter-spacing: 0; }
  .nav span.x { width: 11em; }

  .row { display: flex; gap: 20px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .snd { display: inline-flex; align-items: center; gap: 12px; padding: 8px 4px; min-height: 44px; background: none; border: 0; color: var(--muted); letter-spacing: .1em; }
  .snd:hover, .snd:focus-visible { opacity: 1; outline: none; }
  .snd:focus-visible .sq { outline: 2px solid var(--fg); outline-offset: 3px; }
  .snd .sq { display: block; width: 18px; height: 18px; border: 2px solid var(--fg); box-sizing: border-box; transition: background .4s, border-color .4s, box-shadow .4s, transform .15s; }
  .snd:active .sq { transform: scale(.85); }
  .snd[aria-pressed="true"] .sq { background: var(--light); border-color: var(--light); box-shadow: 0 0 16px var(--light); }
  .snd .word { display: inline-grid; grid-auto-flow: column; align-items: baseline; transition: color .5s, text-shadow .5s; }
  .snd .word > :first-child { grid-area: 1 / 1; white-space: pre; }
  .snd .on, .snd .off { grid-area: 1 / 2; visibility: hidden; }
  .snd[aria-pressed="true"] .on { visibility: visible; }
  .snd[aria-pressed="false"] .off { visibility: visible; }
  .snd[aria-pressed="true"] .word { color: var(--ink); text-shadow: 0 0 12px hsl(var(--h) 80% 60% / .7); }
  @media (prefers-reduced-motion: reduce) { .line { transition: none; } }
</style>
</head>
<body>
<main>
  <h1>Sit · under 3 minutes</h1>

  <div class="box" id="box" title="Click to start or pause">
    <svg viewBox="0 0 100 100" role="img" aria-label="A square of light that holds still; a dot travels its edge once over the sitting">
      <circle class="dot" id="dot" cx="0" cy="0" r="3"/>
    </svg>
    <div class="label" aria-live="polite">
      <div class="phase" id="phase">Ready</div>
      <div class="line" id="line">Sit with it. Nothing to fix.</div>
    </div>
  </div>

  <div class="meta">
    <span id="round">Part 0 / 5</span>
    <span id="left">2:40</span>
  </div>

  <div class="row">
    <button id="btn" type="button">Start</button>
    <button id="snd" type="button" class="snd" aria-pressed="true"><span class="sq"></span><span class="word"><span>Voice </span><span class="on" id="vn">1</span><span class="off">off</span></span></button>
  </div>
  <p class="hint">A voice reads each line; the switch changes it or turns it off. The aim is to stay, not to make it go.</p>
  <nav class="nav" aria-label="Instruments"><a class="x" href="hexagon.html" aria-label="Previous: Hexagon">←</a><span class="x" aria-current="page">Sit</span><a class="x" href="index.html" aria-label="Next: Box">→</a></nav>
</main>

    ['Kind',  'Say to yourself what you would say to a friend.', 10],
    ['Kind',  'This is hard. I can be here with it.', 10],

  const bufs = { 1: [], 2: [] };
  const bytesOf = b64 => { const bin = atob(b64), arr = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i); return arr.buffer; };
  try {                                         // decode at load, off the main context, so each line starts on time
    const off = new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(1, 8, 44100);
    for (const v of [1, 2]) VOICE[v].forEach((b64, i) => off.decodeAudioData(bytesOf(b64), buf => { bufs[v][i] = buf; }, () => {}));
  } catch (e) {}
  let src = null;
  function hush() { if (src) { try { src.stop(); } catch (e) {} src = null; } }
  function say(i) {
    hush();
    if (!sound) return;
    const c = anyAudio(); if (!c) return;
    const v = which;
    const go = buf => { if (!running || lastLine !== i || which !== v || !sound) return; hush(); const n = c.createBufferSource(); n.buffer = buf; n.connect(c.destination); n.start(); src = n; };
    if (bufs[v][i]) return go(bufs[v][i]);
    c.decodeAudioData(bytesOf(VOICE[v][i]), buf => { bufs[v][i] = buf; go(buf); }, () => {});
  }
  sndBtn.addEventListener('click', e => {         // one switch, three places: voice 1, voice 2, off
    e.stopPropagation();
    if (sound && which === 1) which = 2; else if (sound) sound = false; else { sound = true; which = 1; }
    showSound();
    try { localStorage.setItem('instruments.sound', sound ? 'on' : 'off'); localStorage.setItem('sit.voice', String(which)); } catch (e) {}
    switchClick();
    if (!sound) hush(); else if (running && lastLine >= 0) say(lastLine);
  });

  // Keep the phone's screen on while the timer runs. Released on pause, finish, or when the tab is hidden.
  let lock = null;
  async function keepAwake() {
    try { if (!lock && navigator.wakeLock) { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => { lock = null; }); } } catch (e) {}
  }
  function letSleep() { if (lock) { lock.release().catch(() => {}); lock = null; } }

  const fmt = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  const lineAt = t => { let i = 0; while (i + 1 < LINES.length && STARTS[i + 1] <= t) i++; return i; };

  function place(t) {                               // the dot: once round the square over the whole sitting
    const u = Math.min(0.9999, t / TOTAL) * 4, p = Math.floor(u), f = u - p, a = V[p], b = V[(p + 1) % 4];
    dot.setAttribute('cx', a[0] + (b[0] - a[0]) * f);
    dot.setAttribute('cy', a[1] + (b[1] - a[1]) * f);
  }
  function render(t) {
    const i = lineAt(t);
    if (i !== lastLine) {
      lastLine = i;
      phaseEl.textContent = LINES[i][0];
      lineEl.textContent = LINES[i][1];
      roundEl.textContent = `Part ${PARTS.indexOf(LINES[i][0]) + 1} / ${PARTS.length}`;
      say(i);
    }
    place(t);
    root.style.setProperty('--h', 215 + 110 * (0.5 - 0.5 * Math.cos(2 * Math.PI * t / TOTAL)));
    leftEl.textContent = fmt(TOTAL - t);
  }

  function tick(now) {
    if (!running) return;
    const dt = Math.max(0, (now - last) / 1000);
    elapsed += dt; last = now;
    if (elapsed >= TOTAL) { finish(); return; }
    render(elapsed);
    raf = requestAnimationFrame(tick);
  }
  function start() {
    if (elapsed >= TOTAL) elapsed = 0;
    else elapsed = STARTS[lineAt(elapsed)];         // a resume goes back to the start of the line it stopped in
    lastLine = -1;
    running = true; last = performance.now();
    btn.textContent = 'Pause';
    keepAwake();
    render(elapsed);                                // the first line speaks inside the tap, which phones require
    raf = requestAnimationFrame(tick);
  }
  function pause() {
    running = false; cancelAnimationFrame(raf);
    letSleep(); hush();
    btn.textContent = elapsed > 0 ? 'Resume' : 'Start';
    phaseEl.textContent = 'Paused';
  }
  function finish() {
    running = false; letSleep();
    elapsed = TOTAL; lastLine = -1;
    place(0); root.style.setProperty('--h', 215);
    phaseEl.textContent = 'Done'; lineEl.textContent = 'You stayed.';
    roundEl.textContent = `Part ${PARTS.length} / ${PARTS.length}`; leftEl.textContent = '0:00';
    btn.textContent = 'Again';
  }

  const toggle = () => running ? pause() : start();
  btn.addEventListener('click', toggle);
  box.addEventListener('click', toggle);
  document.addEventListener('keydown', e => { if (e.code === 'Space' && !e.repeat) { e.preventDefault(); toggle(); } });
  document.addEventListener('visibilitychange', () => { if (document.hidden && running) pause(); });
  window.addEventListener('pagehide', hush);
  leftEl.textContent = fmt(TOTAL);
})();
