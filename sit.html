<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sit</title>
<meta name="description" content="Under three minutes: a voice walks you through sitting with anxiety. Body, facts, mind, kindness, here.">
<meta name="theme-color" content="#f4f1ea">
<style>
  :root {
    --bg: #ece9e2; --fg: #1a1a1a; --muted: #7a766e; --on: #ffffff;
    --l: 46; --glow: .35;
    --h: 215;               /* hue of the light; drifts over the session */
    --light: hsl(var(--h) 60% 44%);
    --ink: hsl(var(--h) 70% 72%);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b0c10; --fg: #ece9e2; --muted: #8a877f; --l: 30; --glow: .6; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font: 300 18px/1.4 system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    display: grid; place-items: center; padding: 16px;
    -webkit-tap-highlight-color: transparent;
  }
  main { width: min(100%, 420px); display: grid; gap: 36px; justify-items: center; text-align: center; }
  h1 { font-size: 13px; font-weight: 500; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }

  /* the pentagon holds still: it is the seat. Five sides for five parts; the dot walks one side per part. */
  .box {
    position: relative; width: min(72vw, 300px); aspect-ratio: 1; cursor: pointer; user-select: none;
  }
  .box svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible;
             filter: drop-shadow(0 0 45px hsl(var(--h) 60% calc(var(--l) * 1%) / var(--glow))); }
  .pent { fill: hsl(var(--h) 60% calc(var(--l) * 1%)); }
  .dot { fill: var(--on); opacity: .9; }
  .label { position: absolute; inset: 0; display: grid; place-content: center; gap: 14px; padding: 16% 15% 6%; pointer-events: none; color: var(--on); }   /* inside the pentagon: it is narrow at the top */
  .phase { font-size: 13px; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; opacity: .8; }
  .line { font-size: min(21px, 5.4vw); font-weight: 300; line-height: 1.35; text-wrap: balance; transition: opacity .6s; }
  .line.out { opacity: 0; }

  .meta { display: flex; gap: 32px; color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; }
  button {
    font: inherit; font-size: 14px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase;
    border: 0; background: var(--fg); color: var(--bg); padding: 12px 32px; cursor: pointer; border-radius: 0;
  }
  button:hover, button:focus-visible { opacity: .85; outline: none; }
  #btn { min-width: 140px; } #snd { min-width: 128px; }                      /* same on every page: the label changes, the button and the switch do not move */
  .hint { color: var(--muted); font-size: 14px; min-height: 4.2em; }   /* room for three lines on every page, so the carousel sits at one height */
  .x { display: inline-flex; align-items: center; min-height: 44px; padding: 10px 8px; color: var(--muted); font-size: 12px; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; text-decoration: none; }
  .x:hover, .x:focus-visible, .x[aria-current] { color: var(--fg); outline: none; }
  /* the switch: neighbour's shape and name, arrow, this page's shape and name, arrow, neighbour's name and shape.
     The middle is 116 px on every page and the sides share the rest, so the arrows never move. */
  .nav { display: grid; grid-template-columns: minmax(0, 1fr) 116px minmax(0, 1fr); align-items: center; width: 100%; }
  .nav .x { gap: 6px; padding-left: 0; padding-right: 0; }
  .nav span.x { justify-content: center; }
  .nav a.x { min-width: 0; font-size: 9.5px; letter-spacing: .04em; }
  .nav a.x:first-child { justify-content: flex-end; }
  .nav a.x:last-child { justify-content: flex-start; }
  /* one line through the middle: each word's box is cut to its capitals, so its centre is the ink's centre in any font */
  .nav .n { min-width: 0; overflow-x: clip; overflow-y: visible; white-space: nowrap; line-height: 1; text-box: trim-both cap alphabetic; }
  .nav svg.ar { margin: 0 1px; }                                       /* the arrow is drawn, not typed: its shaft is the centre line */
  .nav svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 9; flex: none; overflow: visible; }   /* each exercise's own shape, as a contour */

  .row { display: flex; gap: 20px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .snd { display: inline-flex; align-items: center; gap: 12px; padding: 8px 4px; min-height: 44px; background: none; border: 0; color: var(--muted); letter-spacing: .1em; }
  .snd:hover, .snd:focus-visible { opacity: 1; outline: none; }
  .snd:focus-visible .sq { outline: 2px solid var(--fg); outline-offset: 3px; }
  .snd .sq { display: block; width: 18px; height: 18px; border: 2px solid var(--fg); box-sizing: border-box; transition: background .4s, border-color .4s, box-shadow .4s, transform .15s; }
  .snd:active .sq { transform: scale(.85); }
  .snd[aria-pressed="true"] .sq { background: var(--light); border-color: var(--light); box-shadow: 0 0 16px var(--light); }
  .snd .word { display: inline-grid; grid-auto-flow: column; align-items: baseline; transition: color .5s, text-shadow .5s; }
  .snd .word > :first-child { grid-area: 1 / 1; white-space: pre; }
  .snd .on, .snd .off { grid-area: 1 / 2; visibility: hidden; }
  .snd[aria-pressed="true"] .on { visibility: visible; }
  .snd[aria-pressed="false"] .off { visibility: visible; }
  .snd[aria-pressed="true"] .word { color: var(--ink); text-shadow: 0 0 12px hsl(var(--h) 80% 60% / .7); }
  @media (prefers-reduced-motion: reduce) { .line { transition: none; } .box svg { filter: none; } }
  /* lang:start (written by sounds/recipe/lang.py) */
  /* the language switch: one small word in the corner, the language it would change to */
  #lang { position: fixed; top: 0; right: 0; min-width: 48px; min-height: 44px; padding: 7px 12px 0 0; display: grid; place-content: start end;
          background: none; border: 0; color: var(--muted); font-size: 10.5px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; opacity: 1; }
  #lang:hover, #lang:focus-visible { color: var(--fg); opacity: 1; outline: none; }
  #lang:focus-visible { text-decoration: underline; text-underline-offset: 4px; }
  /* lang:end */
</style>
</head>
<body>
<main>
  <h1>Sit · under 3 minutes</h1>

  <div class="box" id="box" title="Click to start or pause">
    <svg viewBox="0 0 100 100" role="img" aria-label="A pentagon of light that holds still; a dot travels one side for each of the five parts">
      <polygon class="pent" points="50,2.4 100,38.8 80.9,97.6 19.1,97.6 0,38.8"/>
      <circle class="dot" id="dot" cx="50" cy="2.4" r="3"/>
    </svg>
    <div class="label" aria-live="polite">
      <div class="phase" id="phase">Ready</div>
      <div class="line" id="line">Sit with it. Nothing to fix.</div>
    </div>
  </div>

  <div class="meta">
    <span id="round">Part 0 / 5</span>
    <span id="left">2:44</span>
  </div>

  <div class="row">
    <button id="btn" type="button">Start</button>
    <button id="snd" type="button" class="snd" aria-pressed="true"><span class="sq"></span><span class="word"><span>Voice </span><span class="on" id="vn">1</span><span class="off">off</span></span></button>
  </div>
  <p class="hint">A voice reads each line; the switch changes it or turns it off. The aim is to stay, not to make it go.</p>
  <nav class="nav" aria-label="Instruments"><a class="x" href="hexagon.html" aria-label="Previous: Hex"><svg viewBox="0 0 100 100" aria-hidden="true"><polygon points="50,5 89,27.5 89,72.5 50,95 11,72.5 11,27.5"/></svg><span class="n">Hex</span><svg class="ar" viewBox="0 0 100 100" aria-hidden="true"><path d="M94 50H10M40 20L10 50l30 30"/></svg></a><span class="x" aria-current="page"><svg viewBox="0 0 100 100" aria-hidden="true"><polygon points="50,8 94,40 77,92 23,92 6,40"/></svg><span class="n">Sit</span></span><a class="x" href="widen.html" aria-label="Next: Widen"><svg class="ar" viewBox="0 0 100 100" aria-hidden="true"><path d="M6 50h84M60 20l30 30-30 30"/></svg><span class="n">Widen</span><svg viewBox="0 0 100 100" aria-hidden="true"><polygon points="50,10 94,86 6,86"/></svg></a></nav>
</main>

<script>
(() => {
  // ---- the script: [part, line, seconds until the next line]. Change the sitting here and nowhere else. ----
  // The five parts follow Jenny Matthews, LMFT, "How to sit with anxiety" (State of Mind Therapy): curious about
  // the body, call the sensation what it is, curious about the mind, encouraging not critical; then feet and room.
  const LINES = [
    ['Body',  'Find where it sits in your body.', 8],
    ['Body',  'Chest. Stomach. Throat. Hands.', 10],
    ['Body',  'Name what is there, in plain words. Tight. Hot. Fluttering.', 12],
    ['Body',  'Watch it. Nothing to fix.', 14],
    ['Facts', 'This is a sensation.', 8],
    ['Facts', 'It is uncomfortable. It is not an emergency.', 10],
    ['Facts', 'If the mind runs ahead, come back to what is here.', 12],
    ['Mind',  'Now the thoughts. Watch them like a show.', 10],
    ['Mind',  'Is it predicting? Wanting to be sure? Solving? Asking for reassurance?', 14],
    ['Mind',  'Name the kind. Stay in your seat.', 16],
    ['Kind',  'Say to yourself what you would say to a friend.', 10],
    ['Kind',  'This is hard. I can be here with it.', 10],
    ['Kind',  'It can stay as long as it stays.', 10],
    ['Here',  'Feel your feet. Your weight in the seat.', 10],
    ['Here',  'Look at one thing in the room.', 10],
  ];
  const RATE = 0.85;                                // speaking rate; 1 is the device's normal
  const PARTS = [...new Set(LINES.map(l => l[0]))];
  const STARTS = []; let TOTAL = 0; for (const l of LINES) { STARTS.push(TOTAL); TOTAL += l[2]; }
  const V = [[50, 2.4], [100, 38.8], [80.9, 97.6], [19.1, 97.6], [0, 38.8]];   // corners, clockwise from the top
  const PSTART = PARTS.map(n => STARTS[LINES.findIndex(l => l[0] === n)]).concat(TOTAL);   // when each part begins; then the end

  const $ = id => document.getElementById(id);
  const dot = $('dot'), box = $('box'), btn = $('btn');
  const phaseEl = $('phase'), lineEl = $('line'), roundEl = $('round'), leftEl = $('left');
  const root = document.documentElement;
  let running = false, elapsed = 0, last = 0, raf = 0, lastLine = -1;

  // ---- sound: a recorded voice (two to choose from), and one recorded click for the switch. Nothing sounds before a tap. ----
  let ctx = null, sound = true, which = 1;
  try { which = localStorage.getItem('sit.voice') === '2' ? 2 : 1; } catch (e) {}
  try { sound = localStorage.getItem('instruments.sound') !== 'off'; } catch (e) {}
  const sndBtn = $('snd');
  const showSound = () => { sndBtn.setAttribute('aria-pressed', String(sound)); $('vn').textContent = which; };
  showSound();
  const mkCtx = () => {                         // on iPhone the 'playback' session keeps the ring switch from muting it
    const c = new (window.AudioContext || window.webkitAudioContext)();
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
    return c;
  };
  const anyAudio = () => { try { if (!ctx) ctx = mkCtx(); if (ctx.state === 'suspended') ctx.resume(); return ctx; } catch (e) { return null; } };

  let switchBuf = null;
  const bytes = () => { const bin = atob(SWITCH_WAV), arr = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i); return arr.buffer; };
  try { new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(1, 8, 44100).decodeAudioData(bytes(), b => { switchBuf = b; }, () => {}); } catch (e) {}
  function switchClick() {                      // the switch always clicks, whatever the setting
    const c = anyAudio(); if (!c) return;
    const go = buf => { const s = c.createBufferSource(), g = c.createGain(); s.buffer = buf; g.gain.value = 0.9; s.connect(g).connect(c.destination); s.start(); };
    if (switchBuf) return go(switchBuf);
    c.decodeAudioData(bytes(), b => { switchBuf = b; go(b); }, () => {});
  }
